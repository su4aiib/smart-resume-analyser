[project]
name = "smart-resume-analyzer"
version = "0.1.0"
description = "Resume analysis, skill extraction, job matching and recommendations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "spacy>=3.7",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "streamlit>=1.37",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "reportlab>=4.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
